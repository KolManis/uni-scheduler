{{define "title"}}Корпуса{{end}}
{{define "content"}}
<div class="toolbar">
  <h1>Корпуса</h1>
  <a class="btn" hx-get="/ui/buildings/new" hx-target="#main" href="/ui/buildings/new">+ Добавить корпус</a>
</div>
{{if .Error}}<div class="banner error">{{.Error}}</div>{{end}}
<table>
  <thead><tr><th>Название</th><th>Адрес</th><th></th></tr></thead>
  <tbody>
    {{range .Buildings}}
    <tr>
      <td>{{.Name}}</td>
      <td>{{.Address}}</td>
      <td class="actions">
        <a class="btn small secondary" hx-get="/ui/buildings/{{.ID}}/edit" hx-target="#main" href="/ui/buildings/{{.ID}}/edit">Изменить</a>
        <button class="btn small danger" hx-delete="/ui/buildings/{{.ID}}" hx-target="#main" hx-confirm="Удалить корпус «{{.Name}}»?">Удалить</button>
      </td>
    </tr>
    {{else}}
    <tr><td colspan="3" class="muted">Пока нет ни одного корпуса</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
