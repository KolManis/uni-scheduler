<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif" font-size="12">
  <text x="390" y="20" text-anchor="middle" font-size="14" font-weight="bold">Диаграмма последовательности: ручная корректировка назначения</text>

  <!-- Lifeline boxes -->
  <rect x="20"  y="35" width="100" height="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="70"  y="49" text-anchor="middle" font-size="11" font-weight="bold">Клиент</text>
  <text x="70"  y="63" text-anchor="middle" font-size="10">(HTTP)</text>

  <rect x="155" y="35" width="120" height="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="215" y="49" text-anchor="middle" font-size="11" font-weight="bold">Schedule</text>
  <text x="215" y="63" text-anchor="middle" font-size="10">Handler</text>

  <rect x="320" y="35" width="120" height="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="380" y="49" text-anchor="middle" font-size="11" font-weight="bold">Generator</text>
  <text x="380" y="63" text-anchor="middle" font-size="10">Service</text>

  <rect x="490" y="35" width="130" height="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="555" y="49" text-anchor="middle" font-size="11" font-weight="bold">Output</text>
  <text x="555" y="63" text-anchor="middle" font-size="10">Repository</text>

  <rect x="660" y="35" width="100" height="36" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="710" y="49" text-anchor="middle" font-size="11" font-weight="bold">check</text>
  <text x="710" y="63" text-anchor="middle" font-size="10">Conflict()</text>

  <!-- Lifelines -->
  <line x1="70"  y1="71" x2="70"  y2="510" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="215" y1="71" x2="215" y2="510" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="380" y1="71" x2="380" y2="510" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="555" y1="71" x2="555" y2="510" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="710" y1="71" x2="710" y2="510" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Activation boxes -->
  <rect x="65"  y="100" width="10" height="375" fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="210" y="115" width="10" height="345" fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="375" y="135" width="10" height="300" fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="550" y="155" width="10" height="65"  fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="705" y="270" width="10" height="80"  fill="#ddd" stroke="#000" stroke-width="1"/>
  <rect x="550" y="380" width="10" height="45"  fill="#ddd" stroke="#000" stroke-width="1"/>

  <!-- Messages -->
  <line x1="75"  y1="110" x2="210" y2="120" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="140" y="108" text-anchor="middle" font-size="11">1: PATCH /schedules/{id}/assignments/{idx}</text>

  <line x1="220" y1="140" x2="375" y2="148" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="295" y="138" text-anchor="middle" font-size="11">2: PatchAssignment(id, idx, patch)</text>

  <line x1="385" y1="160" x2="550" y2="168" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="467" y="158" text-anchor="middle" font-size="11">3: GetSchedule(id)</text>

  <line x1="550" y1="215" x2="385" y2="207" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="467" y="203" text-anchor="middle" font-size="11">Schedule</text>

  <!-- Apply patch -->
  <rect x="340" y="222" width="80" height="18" fill="#f0f0f0" stroke="#000" stroke-width="1"/>
  <text x="380" y="235" text-anchor="middle" font-size="10">apply patch → assignments[idx]</text>

  <line x1="385" y1="248" x2="705" y2="270" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="540" y="256" text-anchor="middle" font-size="11">4: checkConflict(assignments, idx)</text>

  <!-- alt: conflict -->
  <rect x="340" y="282" width="410" height="95" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="340" y="282" width="50" height="16" fill="#ddd" stroke="#000" stroke-width="1"/>
  <text x="365" y="294" text-anchor="middle" font-size="10" font-weight="bold">alt</text>
  <text x="360" y="310" font-size="10" font-style="italic">[конфликт HC1/HC2/HC3]</text>
  <line x1="705" y1="315" x2="375" y2="305" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="538" y="302" text-anchor="middle" font-size="11">conflict info</text>
  <line x1="340" y1="328" x2="750" y2="328" stroke="#000" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="360" y="344" font-size="10" font-style="italic">[нет конфликта]</text>
  <line x1="705" y1="350" x2="375" y2="342" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="538" y="338" text-anchor="middle" font-size="11">ok</text>
  <text x="710" y="365" text-anchor="middle" font-size="9" font-style="italic">конец alt</text>

  <!-- conflict path: return 409 -->
  <line x1="375" y1="390" x2="210" y2="380" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="290" y="377" text-anchor="middle" font-size="11">[конфликт] откат, return 409</text>

  <!-- success path: recalc + save -->
  <rect x="340" y="400" width="80" height="18" fill="#f0f0f0" stroke="#000" stroke-width="1"/>
  <text x="380" y="413" text-anchor="middle" font-size="10">CalculateFitness()</text>

  <line x1="385" y1="425" x2="550" y2="385" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="467" y="400" text-anchor="middle" font-size="11">5: UpdateSchedule(schedule)</text>

  <line x1="550" y1="420" x2="385" y2="440" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="467" y="435" text-anchor="middle" font-size="11">ok</text>

  <line x1="375" y1="455" x2="210" y2="445" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="290" y="441" text-anchor="middle" font-size="11">updated schedule</text>

  <line x1="210" y1="470" x2="75" y2="460" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="140" y="457" text-anchor="middle" font-size="11">6: 200 OK + JSON</text>

  <!-- 409 path -->
  <line x1="210" y1="390" x2="75" y2="400" stroke="#000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrd)"/>
  <text x="140" y="386" text-anchor="middle" font-size="11">409 Conflict + {type, resource_id}</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#000"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>
