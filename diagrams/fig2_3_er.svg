<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, serif" font-size="12">
  <text x="450" y="20" text-anchor="middle" font-size="14" font-weight="bold">Диаграмма классов (ER-диаграмма) модели данных</text>

  <!-- Helper: entity box macro via manual rects -->

  <!-- buildings -->
  <rect x="20" y="40" width="160" height="110" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="20" y="40" width="160" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="57" text-anchor="middle" font-weight="bold">buildings</text>
  <text x="28" y="78">id: text (PK)</text>
  <text x="28" y="95">name: text</text>
  <text x="28" y="112">address: text</text>

  <!-- rooms -->
  <rect x="220" y="40" width="180" height="140" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="220" y="40" width="180" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="310" y="57" text-anchor="middle" font-weight="bold">rooms</text>
  <text x="228" y="78">id: text (PK)</text>
  <text x="228" y="95">building_id: text (FK)</text>
  <text x="228" y="112">number: text</text>
  <text x="228" y="129">capacity: int</text>
  <text x="228" y="146">type: text</text>

  <!-- departments -->
  <rect x="440" y="40" width="160" height="95" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="440" y="40" width="160" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="520" y="57" text-anchor="middle" font-weight="bold">departments</text>
  <text x="448" y="78">id: text (PK)</text>
  <text x="448" y="95">name: text</text>

  <!-- teachers -->
  <rect x="640" y="40" width="240" height="175" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="640" y="40" width="240" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="760" y="57" text-anchor="middle" font-weight="bold">teachers</text>
  <text x="648" y="78">id: text (PK)</text>
  <text x="648" y="95">name: text</text>
  <text x="648" y="112">department_id: text (FK)</text>
  <text x="648" y="129">max_weekly_hours: int</text>
  <text x="648" y="146">unavailable_slots: JSONB</text>
  <text x="648" y="163">preferred_buildings: JSONB</text>

  <!-- groups -->
  <rect x="20" y="280" width="200" height="125" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="20" y="280" width="200" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="120" y="297" text-anchor="middle" font-weight="bold">groups</text>
  <text x="28" y="318">id: text (PK)</text>
  <text x="28" y="335">name: text</text>
  <text x="28" y="352">student_count: int</text>
  <text x="28" y="369">building_ids: JSONB</text>

  <!-- subject_plans -->
  <rect x="280" y="250" width="260" height="210" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="280" y="250" width="260" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="410" y="267" text-anchor="middle" font-weight="bold">subject_plans</text>
  <text x="288" y="288">id: text (PK)</text>
  <text x="288" y="305">name: text</text>
  <text x="288" y="322">department_id: text (FK)</text>
  <text x="288" y="339">teacher_id: text (FK)</text>
  <text x="288" y="356">group_ids: JSONB</text>
  <text x="288" y="373">lecture_hours: int</text>
  <text x="288" y="390">practice_hours: int</text>
  <text x="288" y="407">lab_hours: int</text>
  <text x="288" y="424">parity: text</text>
  <text x="288" y="441">semester_half: text</text>

  <!-- schedules -->
  <rect x="600" y="280" width="270" height="140" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <rect x="600" y="280" width="270" height="24" fill="#ddd" stroke="#000" stroke-width="1.5"/>
  <text x="735" y="297" text-anchor="middle" font-weight="bold">schedules</text>
  <text x="608" y="318">id: serial (PK)</text>
  <text x="608" y="335">name: text</text>
  <text x="608" y="352">score: float</text>
  <text x="608" y="369">assignments: JSONB</text>
  <text x="608" y="386">created_at: timestamp</text>

  <!-- Relations -->
  <!-- buildings 1 → rooms N -->
  <line x1="180" y1="85" x2="220" y2="85" stroke="#000" stroke-width="1.2"/>
  <text x="183" y="80" font-size="10">1</text>
  <text x="206" y="80" font-size="10">N</text>

  <!-- departments 1 → teachers N -->
  <line x1="600" y1="82" x2="640" y2="82" stroke="#000" stroke-width="1.2"/>
  <text x="602" y="77" font-size="10">1</text>
  <text x="628" y="77" font-size="10">N</text>

  <!-- departments 1 → subject_plans N -->
  <line x1="520" y1="135" x2="520" y2="250" stroke="#000" stroke-width="1.2" stroke-dasharray="4,2"/>
  <line x1="520" y1="250" x2="410" y2="250" stroke="#000" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="522" y="200" font-size="10">1</text>
  <text x="400" y="248" font-size="10">N</text>

  <!-- teachers 1 → subject_plans N -->
  <line x1="760" y1="215" x2="760" y2="235" stroke="#000" stroke-width="1.2"/>
  <line x1="760" y1="235" x2="540" y2="235" stroke="#000" stroke-width="1.2"/>
  <line x1="540" y1="235" x2="540" y2="250" stroke="#000" stroke-width="1.2"/>
  <text x="762" y="228" font-size="10">1</text>
  <text x="530" y="248" font-size="10">N</text>

  <!-- groups JSONB ref to subject_plans -->
  <line x1="220" y1="340" x2="280" y2="340" stroke="#000" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="222" y="335" font-size="10">N</text>
  <text x="268" y="335" font-size="10">N</text>
  <text x="235" y="330" font-size="9" font-style="italic">group_ids[]</text>

  <!-- Legend -->
  <line x1="30" y1="555" x2="70" y2="555" stroke="#000" stroke-width="1.2"/>
  <text x="75" y="559" font-size="11">— прямая связь (FK)</text>
  <line x1="30" y1="575" x2="70" y2="575" stroke="#000" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="75" y="579" font-size="11">-- -- JSONB-ссылка</text>
</svg>
