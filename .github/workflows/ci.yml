# Проверка на каждый push и pull request: сборка, go vet, тесты — то же, что make test.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Сборка
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Тесты
        run: go test ./...
